<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - JMC Materials</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/register.css" />
  </head>
  <body>
    <div class="page">
      <div class="container">
        <a href="Page.html"
          ><img src="img/download.png" alt="JMC Logo" class="logo"
        /></a>

        <div class="form-header">
          <h1>Create an account</h1>
          <p>Fill in your details to get started.</p>
        </div>

        <div id="reg-error" class="msg error" style="display: none"></div>
        <div id="reg-success" class="msg success" style="display: none"></div>

        <form
          id="register-form"
          onsubmit="
            event.preventDefault();
            if (window.handleRegister) window.handleRegister(this);
          "
        >
          <div class="section-title">Personal info</div>

          <div class="field">
            <label>Full Name <span class="req">*</span></label>
            <input
              type="text"
              name="full_name"
              placeholder="Juan dela Cruz"
              required
            />
          </div>

          <div class="row-2">
            <div class="field">
              <label>Email <span class="req">*</span></label>
              <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="field">
              <label>Phone <span class="req">*</span></label>
              <input
                type="tel"
                name="phone"
                placeholder="09XX XXX XXXX"
                required
              />
            </div>
          </div>

          <div class="section-title" style="margin-top: 24px">Address</div>

          <div class="field">
            <label>Street / House No. <span class="req">*</span></label>
            <input
              type="text"
              name="address"
              placeholder="e.g. 123 Rizal St., Brgy. Sucat"
              required
            />
          </div>

          <div class="row-2">
            <div class="field">
              <label>Barangay / Town <span class="req">*</span></label>
              <input
                type="text"
                name="town"
                id="town-input"
                list="barangay-list"
                required
                autocomplete="off"
                placeholder="e.g. Sucat"
              />
              <datalist id="barangay-list">
                <option value="Alabang"></option>
                <option value="Bayanan"></option>
                <option value="Buli"></option>
                <option value="Cupang"></option>
                <option value="Poblacion"></option>
                <option value="Putatan"></option>
                <option value="Sucat"></option>
                <option value="Tunasan"></option>
              </datalist>
            </div>
            <div class="field">
              <label>City</label>
              <input
                type="text"
                name="city"
                value="Muntinlupa City"
                readonly
                class="readonly"
              />
            </div>
          </div>

          <div class="section-title" style="margin-top: 24px">Password</div>

          <div class="row-2">
            <div class="field">
              <label>Password <span class="req">*</span></label>
              <div class="pw-wrap">
                <input
                  type="password"
                  name="password"
                  id="password-input"
                  placeholder="Min. 8 characters"
                  required
                  oninput="checkStrength(this.value)"
                />
                <button
                  type="button"
                  class="pw-toggle"
                  onclick="togglePw('password-input', 'icon-pw1')"
                >
                  <img
                    src="img/Showpassword.png"
                    alt="Show password"
                    id="icon-pw1"
                    style="height: 18px; width: auto; opacity: 0.55"
                  />
                </button>
              </div>
              <div id="pw-strength" class="strength-wrap" style="display: none">
                <div class="strength-bars">
                  <div class="bar" id="bar1"></div>
                  <div class="bar" id="bar2"></div>
                  <div class="bar" id="bar3"></div>
                  <div class="bar" id="bar4"></div>
                </div>
                <span id="pw-label" class="strength-label"></span>
              </div>
            </div>
            <div class="field">
              <label>Confirm Password <span class="req">*</span></label>
              <div class="pw-wrap">
                <input
                  type="password"
                  id="confirm-password"
                  placeholder="Repeat password"
                  required
                />
                <button
                  type="button"
                  class="pw-toggle"
                  onclick="togglePw('confirm-password', 'icon-pw2')"
                >
                  <img
                    src="img/Showpassword.png"
                    alt="Show password"
                    id="icon-pw2"
                    style="height: 18px; width: auto; opacity: 0.55"
                  />
                </button>
              </div>
            </div>
          </div>

          <div class="terms-row">
            <input type="checkbox" id="terms-check" required />
            <label for="terms-check">
              I agree to the
              <a href="terms.html" target="_blank">Terms and Conditions</a>. I
              understand delivery is within
              <strong>Muntinlupa City</strong> only.
            </label>
          </div>

          <button type="submit" class="btn-submit" id="reg-submit-btn">
            Create Account
          </button>
        </form>

        <p class="footer-note">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
        <p class="footer-note" style="margin-top: 8px">
          <a href="Page.html">← Back to store</a>
        </p>
      </div>
    </div>

    <!-- CART SIDEBAR -->
    <div id="cart-sidebar" class="cart-sidebar" style="display: none"></div>

    <script>
      function togglePw(id, iconId) {
        const inp = document.getElementById(id);
        const icon = document.getElementById(iconId);
        const show = inp.type === "password";
        inp.type = show ? "text" : "password";
        if (icon) icon.style.opacity = show ? "1" : "0.55";
      }

      function checkStrength(val) {
        const wrap = document.getElementById("pw-strength");
        const label = document.getElementById("pw-label");
        const bars = [1, 2, 3, 4].map((i) =>
          document.getElementById("bar" + i),
        );
        if (!val) {
          wrap.style.display = "none";
          return;
        }
        wrap.style.display = "flex";

        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const colors = ["", "#ef4444", "#f97316", "#eab308", "#22c55e"];
        const labels = ["", "Weak", "Fair", "Good", "Strong"];

        bars.forEach((b, i) => {
          b.style.background = i < score ? colors[score] : "#e2e8f0";
        });
        label.textContent = labels[score] || "";
        label.style.color = colors[score] || "#94a3b8";
      }
    </script>
    <script src="Js/register.js?v=3"></script>
  </body>
</html>
