<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - JMC Materials</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/login.css" />
</head>
<body>
  <div class="page">
    <div class="card">
      <a href="Page.html"><img src="img/download.png" alt="JMC Logo" class="logo" /></a>
      <h1>Reset Password</h1>
      <p class="subtitle">Enter your new password below.</p>
      
      <div id="error-box" class="error-box" style="display:none;"></div>
      <div id="success-box" class="success-box" style="display:none;"></div>
      
      <form id="reset-form" onsubmit="event.preventDefault(); handleResetPassword(this);">
        <label>New Password</label>
        <div class="password-row">
          <input type="password" name="password" id="password-input" placeholder="Enter new password" required minlength="6" />
          <button type="button" onclick="togglePassword('password-input', 'toggle-pw-icon')" style="background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center;">
            <img src="img/Showpassword.png" alt="Show password" style="height:18px; width:auto; opacity:0.55;" id="toggle-pw-icon" />
          </button>
        </div>
        
        <label>Confirm Password</label>
        <div class="password-row">
          <input type="password" name="confirm_password" id="confirm-password-input" placeholder="Confirm new password" required minlength="6" />
          <button type="button" onclick="togglePassword('confirm-password-input', 'toggle-confirm-icon')" style="background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center;">
            <img src="img/Showpassword.png" alt="Show password" style="height:18px; width:auto; opacity:0.55;" id="toggle-confirm-icon" />
          </button>
        </div>
        
        <button type="submit" id="submit-btn" class="submit-btn">Reset Password</button>
      </form>
      
      <p class="bottom-text"><a href="login.html">Back to Login</a></p>
    </div>
  </div>

  <style>
    .success-box {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .success-box strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>

  <script>
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      const isShowing = input.type === 'text';
      input.type = isShowing ? 'password' : 'text';
      if (icon) icon.style.opacity = isShowing ? '0.6' : '1';
    }

    async function handleResetPassword(form) {
      const btn = document.getElementById('submit-btn');
      const errorBox = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');
      const password = form.password.value;
      const confirmPassword = form.confirm_password.value;

      // Hide previous messages
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      // Validate passwords match
      if (password !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorBox.textContent = 'Password must be at least 6 characters.';
        errorBox.style.display = 'block';
        return;
      }

      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        errorBox.textContent = 'Invalid reset link. Please request a new password reset.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting...';

      try {
        const res = await fetch('https://jmchardware.shop/api/auth/reset-password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ token, password })
        });

        const data = await res.json();

        if (data.success) {
          successBox.innerHTML = '<strong>Password Reset Successful!</strong>' +
            'Your password has been changed. You will be redirected to login in 3 seconds...';
          successBox.style.display = 'block';
          form.reset();
          
          // Redirect to login after 3 seconds
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 3000);
        } else {
          errorBox.textContent = data.error || 'Failed to reset password. The link may have expired.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        console.error('Reset password error:', err);
        errorBox.textContent = 'Network error. Please check your connection and try again.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }

    // Check if token is present on page load
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      
      if (!token) {
        const errorBox = document.getElementById('error-box');
        errorBox.textContent = 'Invalid or missing reset token. Please request a new password reset link.';
        errorBox.style.display = 'block';
        document.getElementById('reset-form').style.display = 'none';
      }
    });
  </script>
</body>
</html>
