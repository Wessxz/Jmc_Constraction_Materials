<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - JMC Materials</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Fallback styles kung hindi ma-load yung external CSS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    
    body {
      margin: 0;
      padding: 0;
    }
    
    .page {
      min-height: 100vh;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    
    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 24px;
    }
    
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }
    
    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
    }
    
    .card label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    
    .card input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .card input:focus {
      border-color: #f97316;
    }
    
    .error-box {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 16px;
      text-align: left;
    }
    
    .success-box {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
    }
    
    .success-box strong {
      display: block;
      margin-bottom: 4px;
    }
    
    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .submit-btn:hover {
      background: #ea6c0a;
    }
    
    .submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    
    .bottom-text {
      margin-top: 16px;
      font-size: 13px;
      color: #64748b;
    }
    
    .bottom-text a {
      color: #f97316;
      font-weight: 600;
      text-decoration: none;
    }
    
    .bottom-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <a href="Page.html"><img src="img/download.png" alt="JMC Logo" class="logo" /></a>
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>
      
      <div id="error-box" class="error-box" style="display:none;"></div>
      <div id="success-box" class="success-box" style="display:none;"></div>
      
      <form id="forgot-form" onsubmit="event.preventDefault(); handleForgotPassword(this);">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required />
        <button type="submit" id="submit-btn" class="submit-btn">Send Reset Link</button>
      </form>
      
      <p class="bottom-text">Remember your password? <a href="login.html">Back to Login</a></p>
      <p class="bottom-text"><a href="Page.html">← Back to Store</a></p>
    </div>
  </div>

  <script>
    async function handleForgotPassword(form) {
      const btn = document.getElementById('submit-btn');
      const errorBox = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');
      const email = form.email.value.trim();

      // Hide previous messages
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      if (!email) {
        errorBox.textContent = 'Please enter your email address.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch('https://jmchardware.shop/api/auth/forgot-password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (data.success) {
          successBox.innerHTML = '<strong>Check your email!</strong>' +
            'If an account exists with that email, we\'ve sent a password reset link. ' +
            'Please check your inbox and spam folder.';
          successBox.style.display = 'block';
          form.reset();
        } else {
          errorBox.textContent = data.error || 'Failed to send reset link. Please try again.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        console.error('Forgot password error:', err);
        errorBox.textContent = 'Network error. Please check your connection and try again.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }
  </script>
</body>
</html>
